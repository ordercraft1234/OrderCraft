# Keeps the free-plan API awake.
#
# Render stops the container after fifteen quiet minutes and the next request waits
# about a minute for it to come back. Every five rather than every ten: GitHub's
# schedule runs late by minutes, and the margin against a fifteen-minute threshold has
# to absorb that.
#
# This is a convenience, not a dependency. With API_URL unset the job does nothing;
# GitHub also disables scheduled workflows after sixty days without a commit, and when
# that happens the app still works — the first visitor pays the cold start, and the
# screens that wait say why.
name: Keep alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the API
        env:
          API_URL: ${{ vars.API_URL }}
        # --max-time 120 rather than the default: a cold start is the case this job
        # exists for, so timing out on one would defeat it.
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL is not set — nothing to keep awake."
            exit 0
          fi
          curl -sSf --max-time 120 "$API_URL/health" | cut -c1-60
